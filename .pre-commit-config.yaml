repos:
  - repo: local
    hooks:
      - id: mojibake-check
        name: mojibake-check
        entry: python backend/scripts/check_mojibake.py
        language: system
        pass_filenames: false
      - id: line-endings-check
        name: line-endings-check
        entry: python backend/scripts/check_line_endings.py
        language: system
        pass_filenames: false
