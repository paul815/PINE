name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Only base deps. Heavy ML packages (torch, whisperx, pyannote) are
      # installed at runtime by model_manager.py during onboarding, so tests
      # that need them are expected to be skipped rather than run here.
      - name: Install base dependencies
        run: python -m pip install -r backend/requirements.txt

      # The runner starts with neither, and requirements.txt deliberately
      # carries no dev tooling: pytest because a user's install never needs a
      # test runner, numpy because it arrives with the ML stack at onboarding.
      # CI has to ask for both by hand -- numpy is cheap and unlocks the track
      # tests, torch is not and stays out, so its tests skip.
      - name: Install test dependencies
        run: python -m pip install pytest numpy

      - name: Run test suite
        working-directory: backend
        run: python -m pytest -q --tb=short

  # These two used to hang off a pre-commit hook that nobody had installed, so
  # neither actually ran. Both are standard library only and read the checkout
  # as git wrote it, which is the state that matters for .gitattributes.
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check line endings
        run: python backend/scripts/check_line_endings.py

      - name: Check for mojibake
        run: python backend/scripts/check_mojibake.py
